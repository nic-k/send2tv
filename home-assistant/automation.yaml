alias: send2tv
description: Opent een URL (via webhook) als deep link op de Android TV.
triggers:
  - trigger: webhook
    # Kies een lange, willekeurige tekst. Dit werkt als wachtwoord.
    webhook_id: kies-hier-een-lange-geheime-id
    allowed_methods:
      - POST
    local_only: false
actions:
  - action: remote.turn_on
    target:
      # Vervang door de entity van je tv
      entity_id: remote.jouw_tv
    data:
      activity: "{{ trigger.data.url }}"
